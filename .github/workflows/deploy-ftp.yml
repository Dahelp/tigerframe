name: Deploy TigerFrame to production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload files to the production FTP server"
        required: true
        default: false
        type: boolean

concurrency:
  group: tigerframe-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate PHP and synchronize FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './plugins/*' -print0 |
            xargs -0 -n1 php -l

      - name: Preview or deploy FTP changes
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: totem.gohost.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /www/tigerframe.biz/
          dry-run: ${{ inputs.deploy != true }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agents/**
            **/.codex/**
            **/node_modules/**
            **/plugins/fontawesome-free/svgs/**
            **/*.log
            **/*.tmp
